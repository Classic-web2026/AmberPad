<style>
:root{--bg:#FFFFFF;--soft:#F8FAFC;--lift:#F1F5F9;--tx:#1E293B;--tx2:#64748B;--tx3:#94A3B8;--hd:#0F172A;--blue:#4C8BF5;--bh:#3B78E7;--bp:#2A65D6;--bs:#E8F0FE;--grn:#34A853;--gs:#E6F4EA;--yel:#F4B400;--ys:#FEF7E0;--red:#EA4335;--rs:#FCE8E6;--bd:#E2E8F0;--bdh:#CBD5E1;--dv:#F1F5F9;--ic:#0F172A;
--sh1:0 4px 6px -1px rgba(15,23,42,.05);--sh2:0 8px 20px -6px rgba(15,23,42,.08);--shb:0 8px 20px -6px rgba(37,99,235,.25);--shm:0 20px 40px -12px rgba(15,23,42,.12);--foc:0 0 0 4px rgba(37,99,235,.12);--scrim:rgba(15,23,42,.4);
--sp:cubic-bezier(.34,1.4,.64,1);--sw:264px;--tb:64px}
[data-theme=dark]{--bg:#0B1220;--soft:#111C33;--lift:#1A2540;--tx:#E2E8F0;--tx2:#94A3B8;--tx3:#64748B;--hd:#F1F5F9;--bh:#669DF6;--bp:#82AFFA;--bs:#192D4B;--gs:#132D1C;--ys:#382E0B;--rs:#3C1E1E;--bd:#1E293B;--bdh:#334155;--dv:#1E293B;--ic:#E2E8F0;
--sh1:0 4px 6px -1px rgba(96,165,250,.06);--sh2:0 8px 20px -6px rgba(96,165,250,.1);--shb:0 8px 20px -6px rgba(96,165,250,.28);--shm:0 20px 40px -12px rgba(96,165,250,.14);--foc:0 0 0 4px rgba(96,165,250,.18);--scrim:rgba(11,18,32,.65)}
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 16px/1.5 'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;box-shadow:var(--foc)}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none;overflow:visible}
.ic.sm{width:18px;height:18px}
/* splash */
.splash{--p:var(--yel);--pc:color-mix(in srgb,var(--yel) 26%,var(--bg));position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;transition:opacity .4s ease-out,visibility .4s}
.splash.leave{opacity:0;visibility:hidden}
.sp-box{display:flex;flex-direction:column;align-items:center;gap:28px;padding:24px}
.sp-logo{width:96px;height:96px;border-radius:28px;animation:pop .5s var(--sp) both}
.sp-m{display:none}
.sp-name{font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.5px;color:var(--hd);margin-top:-12px}
.splash svg{display:block;overflow:visible}
@media(max-width:860px){.splash{--p:#FFFFFF;--pc:rgba(255,255,255,.38);background:var(--sbg,#F4B400)}.sp-d{display:none}.sp-m{display:block;width:140px;height:140px;border-radius:0}.sp-name{color:#FFFFFF}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
/* layout */
.app{display:flex;min-height:100vh}
.sb{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--soft);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:60;transition:transform .4s var(--sp)}
.sb-head{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:36px;height:36px;border-radius:12px}
.brand b{font-weight:800;font-size:20px;letter-spacing:-.3px;color:var(--hd)}
.nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nv{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;font-weight:700;font-size:14px;letter-spacing:.1px;color:var(--tx2);text-align:left;transition:background .2s,color .2s,transform .12s}
.nv .ic{color:var(--ic)}
